name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Preparer la cle et l'icone
        run: |
          base64 -d cle_fixe.keystore.b64 > app/cle_fixe.keystore
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          base64 -d icon.b64 > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Construire l'APK
        run: gradle assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CADRE_SIGNATURE.apk

      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: CADRE + SIGNATURE (version ${{ github.run_number }})
          files: CADRE_SIGNATURE.apk
